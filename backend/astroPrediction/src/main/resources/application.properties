## postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/astroprediction_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=2592000000
jwt.issuer=astroprediction
jwt.audience=astroprediction-web

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.currency=INR
stripe.success-url=https://app.astroprediction.com/payment/success
stripe.cancel-url=https://app.astroprediction.com/payment/cancel

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=noreply@astroprediction.com
app.mail.from-name=AstroPrediction

app.upload.path=uploads
app.upload.max-file-size=5242880
app.upload.allowed-types=image/jpeg,image/png,image/gif

app.websocket.endpoint=/ws
app.websocket.allowed-origins=*

app.cors.allowed-origins=http://localhost:5173,https://app.astroprediction.com
app.security.public-paths=/auth/**,/payments/stripe/webhook,/files/public/**,/horoscope/public/**
domain=${DOMAIN:http://localhost:${server.port}}

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:placeholder}
app.pagination.default-size=20
app.pagination.max-size=100

logging.level.com.techtechnicworld.astroprediction=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n



